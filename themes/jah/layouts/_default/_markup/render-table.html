<div class="table-wrapper" tabindex="0" role="group" aria-label="Scrollable table">
  <table>
    {{- if .THead }}
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th scope="col"{{ with .Alignment }} style="text-align:{{ . }}"{{ end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    {{- end }}
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} style="text-align:{{ . }}"{{ end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
