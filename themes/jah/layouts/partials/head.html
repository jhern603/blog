<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>
  {{- if .IsHome -}}
    {{ .Site.Title }} — {{ .Site.Params.description }}
  {{- else -}}
    {{ .Title }} — {{ .Site.Title }}
  {{- end -}}
</title>

{{- with .Description }}
  <meta name="description" content="{{ . }}">
{{- else }}
  <meta name="description" content="{{ $.Site.Params.description }}">
{{- end }}

<meta name="author" content="{{ .Site.Params.author }}">
<meta name="robots" content="index, follow">
{{- $ogImage := .Site.Params.ogImage | default "/og-image.svg" -}}
{{- $ogImageURL := printf "%s%s" .Site.BaseURL $ogImage -}}

{{- if .IsPage }}
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ $.Site.Params.description }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ $ogImageURL }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ .Site.Title }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Title }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ $.Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ $ogImageURL }}">
  {{- with .Date }}
    <meta property="article:published_time" content="{{ .Format "2006-01-02T15:04:05Z07:00" }}">
  {{- end }}
{{- else }}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ .Site.Title }}">
  <meta property="og:description" content="{{ .Site.Params.description }}">
  <meta property="og:url" content="{{ .Site.BaseURL }}">
  <meta property="og:image" content="{{ $ogImageURL }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ .Site.Title }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Site.Title }}">
  <meta name="twitter:description" content="{{ .Site.Params.description }}">
  <meta name="twitter:image" content="{{ $ogImageURL }}">
{{- end }}
<meta name="twitter:site" content="{{ .Site.Params.twitterHandle | default "@jhern603" }}">
<meta name="theme-color" content="#243448">

<link rel="icon" type="image/svg+xml" href="{{ "/favicon.svg" | absURL }}">
<link rel="canonical" href="{{ .Permalink }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ "/css/main.css" | absURL }}">
<link rel="stylesheet" href="{{ "/css/syntax.css" | absURL }}">

{{ range .AlternativeOutputFormats -}}
  <link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink }}">
{{ end -}}
